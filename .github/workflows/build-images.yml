name: Build and Publish Application Images

on:
  push:
    branches: [main]
    paths:
      - "apps/producer/**"
      - "apps/consumer/**"
      - ".github/workflows/build-images.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [producer, consumer]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile apps/${{ matrix.service }}/app.py

      - name: Test message latency calculations
        if: matrix.service == 'consumer'
        run: python -m unittest discover -s apps/consumer -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: ghcr.io/alirezahossaini79/utravs-${{ matrix.service }}:sha-${{ github.sha }}
