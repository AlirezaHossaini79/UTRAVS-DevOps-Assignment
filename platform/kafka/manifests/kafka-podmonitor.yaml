apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: utravs-kafka-broker-metrics
  namespace: kafka
spec:
  namespaceSelector:
    matchNames:
      - kafka
  selector:
    matchLabels:
      strimzi.io/cluster: utravs-kafka
      strimzi.io/kind: Kafka
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
