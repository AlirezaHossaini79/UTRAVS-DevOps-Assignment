imagePullSecrets: []

kafka:
  bootstrapServers: utravs-kafka-kafka-bootstrap.kafka.svc.cluster.local:9094
  securityProtocol: SSL
  sslCaLocation: /etc/kafka/ca.crt
  clientAuth:
    enabled: true
    certLocation: /etc/kafka-client/user.crt
    keyLocation: /etc/kafka-client/user.key
    secretNames:
      producer: utravs-producer-kafka-client
      consumer: utravs-consumer-kafka-client
  topic: utravs-events
  consumerGroup: utravs-consumer-group

producer:
  replicaCount: 1
  image:
    repository: ghcr.io/alirezahossaini79/utravs-producer
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 384Mi

consumer:
  replicaCount: 1
  image:
    repository: ghcr.io/alirezahossaini79/utravs-consumer
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 384Mi
