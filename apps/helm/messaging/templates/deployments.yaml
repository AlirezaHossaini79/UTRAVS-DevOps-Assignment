{{- range $name := list "producer" "consumer" }}
{{- $cfg := index $.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utravs-{{ $name }}
  labels:
    app: utravs-{{ $name }}
spec:
  replicas: {{ $cfg.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: utravs-{{ $name }}

  template:
    metadata:
      labels:
        app: utravs-{{ $name }}
      annotations:
        sidecar.istio.io/inject: "true"

    spec:
      serviceAccountName: utravs-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45

      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
        {{- if $.Values.kafka.clientAuth.enabled }}
        fsGroup: 10001
        {{- end }}

      containers:
        - name: {{ $name }}
          image: "{{ $cfg.image.repository }}:{{ required (printf "%s.image.tag is required" $name) $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ $cfg.port }}

          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ $.Values.kafka.securityProtocol | quote }}
            - name: KAFKA_SSL_CA_LOCATION
              value: {{ $.Values.kafka.sslCaLocation | quote }}
            {{- if $.Values.kafka.clientAuth.enabled }}
            - name: KAFKA_SSL_CERT_LOCATION
              value: {{ $.Values.kafka.clientAuth.certLocation | quote }}
            - name: KAFKA_SSL_KEY_LOCATION
              value: {{ $.Values.kafka.clientAuth.keyLocation | quote }}
            {{- end }}
            - name: KAFKA_TOPIC
              value: {{ $.Values.kafka.topic | quote }}
            {{- if eq $name "consumer" }}
            - name: KAFKA_GROUP_ID
              value: {{ $.Values.kafka.consumerGroup | quote }}
            {{- end }}

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10

          resources:
            {{- toYaml $cfg.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-ca
              mountPath: /etc/kafka
              readOnly: true
            {{- if $.Values.kafka.clientAuth.enabled }}
            - name: kafka-client
              mountPath: /etc/kafka-client
              readOnly: true
            {{- end }}
            - name: vault-sa-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: vault-ca
              mountPath: /etc/vault
              readOnly: true

      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-ca
          configMap:
            name: utravs-kafka-ca
        {{- if $.Values.kafka.clientAuth.enabled }}
        - name: kafka-client
          secret:
            secretName: {{ index $.Values.kafka.clientAuth.secretNames $name | quote }}
            defaultMode: 0440
        {{- end }}
        - name: vault-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: vault-jwt
                  expirationSeconds: 600
        - name: vault-ca
          configMap:
            name: utravs-vault-ca
{{- end }}
