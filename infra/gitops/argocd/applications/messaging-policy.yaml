apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: messaging-policy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:AlirezaHossaini79/UTRAVS-DevOps-Assignment.git
    targetRevision: main
    path: platform/policy/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: messaging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
