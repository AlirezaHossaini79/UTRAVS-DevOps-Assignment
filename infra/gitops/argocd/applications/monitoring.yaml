apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.5.0
    helm:
      releaseName: monitoring
      valuesObject:
        grafana:
          enabled: false

        defaultRules:
          create: false

        kubeApiServer:
          enabled: true
        kubelet:
          enabled: true
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        kube-state-metrics:
          image:
            registry: k8s-mirror.liara.ir
            repository: kube-state-metrics/kube-state-metrics
            tag: v2.20.0
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

        prometheus:
          enabled: true
          additionalServiceMonitors:
            - name: utravs-istiod
              namespaceSelector:
                matchNames:
                  - istio-system
              selector:
                matchLabels:
                  app: istiod
              endpoints:
                - port: http-monitoring
                  path: /metrics
                  interval: 30s
          prometheusSpec:
            replicas: 1
            retention: 3d
            retentionSize: 3GB
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}
            ruleSelectorNilUsesHelmValues: false
            ruleSelector: {}
            ruleNamespaceSelector: {}
            additionalScrapeConfigs:
              - job_name: utravs-messaging-istio
                scrape_interval: 30s
                metrics_path: /stats/prometheus
                scheme: http
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names:
                        - messaging
                relabel_configs:
                  - action: keep
                    source_labels:
                      - __meta_kubernetes_pod_annotation_prometheus_io_scrape
                    regex: "true"
                  - action: keep
                    source_labels:
                      - __meta_kubernetes_pod_phase
                    regex: Running
                  - action: keep
                    source_labels:
                      - __meta_kubernetes_pod_container_name
                    regex: "producer|consumer"
                  - action: replace
                    source_labels:
                      - __meta_kubernetes_pod_ip
                    regex: (.+)
                    target_label: __address__
                    replacement: "$1:15020"
                  - action: replace
                    source_labels:
                      - __meta_kubernetes_pod_name
                    target_label: pod
                  - action: replace
                    source_labels:
                      - __meta_kubernetes_namespace
                    target_label: namespace
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1536Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi

        alertmanager:
          enabled: true
          alertmanagerSpec:
            replicas: 1
            retention: 48h
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 300m
                memory: 256Mi
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
