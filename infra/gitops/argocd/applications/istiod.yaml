apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:AlirezaHossaini79/UTRAVS-DevOps-Assignment.git
    targetRevision: main
    path: infra/service-mesh/istio/charts/istiod
    helm:
      releaseName: istiod
      valueFiles:
        - values-utravs.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
