apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:AlirezaHossaini79/UTRAVS-DevOps-Assignment.git
    targetRevision: main
    path: platform/vault/chart
    helm:
      releaseName: vault
      valueFiles:
      - ../values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - ServerSideApply=true
